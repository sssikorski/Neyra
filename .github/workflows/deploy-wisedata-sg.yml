name: Deploy wisedata.sg
on:
  push:
    branches: [main, claude/deploy-landing-wisedata-sg-h3tec5]
    paths: ['wisedata-sg/**', '.github/workflows/deploy-wisedata-sg.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wisedata-sg
      - id: d
        uses: actions/deploy-pages@v4
